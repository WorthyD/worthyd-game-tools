name: AI instructions in sync

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/ai/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - '.claude/rules/**'
      - 'tools/ai/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tools/ai/sync-ai-rules.mjs --check
