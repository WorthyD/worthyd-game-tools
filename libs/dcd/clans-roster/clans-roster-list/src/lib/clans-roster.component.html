<div class="clan-roster">
  <lib-table-view
    class="clan-roster-table"
    [isLoading]="isLoading()"
    [dataSource]="$safeNavigationMigration((rosterInfo$ | async)?.dataSource)!"
    [header]="'Clan Roster'"
    [viewer]="rosterViewer"
    [filterer]="rosterFilter"
    [sorter]="rosterSorter"
  >
  </lib-table-view>
</div>
