@if (vm$|async; as vm) {
  <header>
    <h1>{{vm.clans.title}}</h1>
    <p>
      Please reach out to <a href="https://twitter.com/WorthyD" target="_blank">WorthyD</a> to update
    </p>
    <button color="accent" mat-raised-button routerLink="/">Let's Go</button>
  </header>
  <div class="found-clans">
    @for (clan of vm.clans.clans; track clan) {
      <app-clan-detail [clanConfig]="clan" [showAdd]="clanIsActive(clan, vm.activeClans)" class="clan">
      </app-clan-detail>
    }
  </div>
  @for (clanGroup of vm.clans.subGroups; track clanGroup) {
    <div class="clan-groups">
      <h2>{{clanGroup.title}}</h2>
      <div class="found-clans">
        @for (clan of clanGroup.clans; track clan) {
          <app-clan-detail [clanConfig]="clan" [showAdd]="clanIsActive(clan, vm.activeClans)" class="clan">
          </app-clan-detail>
        }
      </div>
      <hr>
      </div>
    }
  }
